<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: sans-serif;
      background: #ffffff;
      color: #111111;
    }

    .wrap {
      text-align: center;
    }

    .code {
      font-size: clamp(64px, 16vw, 160px);
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.04em;
    }

    .text {
      margin-top: 20px;
      font-size: 24px;
      letter-spacing: 0.08em;
      color: #444444;
    }

    .jp-text {
      margin-top: 12px;
      font-size: 14px;
      color: #666666;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="code">404</div>
    <p class="text">Not Found</p>
    <p class="jp-text">お探しのページは見つかりませんでした。</p>
  </main>
</body>
</html>
